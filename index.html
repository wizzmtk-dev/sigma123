<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tes publish web</title>

<style>
  .tombol-biru {
  background-color: #3b82f6; /* warna biru */
  color: white;
  border: none;
  padding: 12px 30px;
  font-size: 16px;

  border-radius: 30px; /* bikin ujungnya bulat */
  
  box-shadow: 0px 6px 10px rgba(0,0,0,0.2); /* bayangan */

  cursor: pointer;

  transition: all 0.2s ease; /* animasi halus */
}

/* efek saat mouse di atas tombol */
.tombol-biru:hover {
  background-color: #2563eb;
  transform: translateY(-2px);
}

/* efek saat tombol ditekan */
.tombol-biru:active {
  transform: translateY(2px);
  box-shadow: 0px 3px 5px rgba(0,0,0,0.2);
}
body { 
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
</style>
<body style="text-align: center;">
    <button class="tombol-biru">klik disini</button>
</body>
